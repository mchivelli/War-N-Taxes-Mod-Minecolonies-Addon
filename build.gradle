plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.1'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        url = "https://maven.pkg.github.com/ldtteam/minecolonies"
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
            password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
        }
    }
    maven {
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty('java.version')}, JVM: ${System.getProperty('java.vm.version')} (${System.getProperty('java.vendor')}), Arch: ${System.getProperty('os.arch')}"

// Default run configurations.
runs {
    // applies to all the run configs below
    configureEach {
        // Recommended logging data for a userdev environment
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    // This run config launches GameTestServer and runs all registered gametests, then exits.
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // NeoForge dependency
    implementation "net.neoforged:neoforge:${neo_version}"

    // MineColonies and its dependencies (1.21.1 NeoForge versions)
    // Core MineColonies mod
    implementation "curse.maven:minecolonies-245506:7162708"
    
    // MineColonies required dependencies
    implementation "curse.maven:structurize-298744:7041361"
    implementation "curse.maven:multi-piston-303278:5783614"
    implementation "curse.maven:blockui-522992:6367809"
    implementation "curse.maven:domum-ornamentum-527361:6688449"
    
    // SDMShop integration is OPTIONAL and accessed purely via reflection (string class
    // names in SDMShopIntegration/SDMShopCompat) + console commands in RaidManager — it is
    // NOT a compile dependency. We do not bundle it at runtime because SDMShop 3.3.1 requires
    // SDM Economy (net.sixik.sdmeconomy) which is a separate mod; loading SDMShop without it
    // crashes mod construction. The integration is also currently stubbed for 1.21.1. Users who
    // install SDMShop (+ SDM Economy) get the integration auto-detected via reflection.
    // To work on the integration in dev, re-enable and also add the SDM Economy dependency:
    // implementation "curse.maven:sdm-shop-948942:7173785"
    
    // FTB Teams dependency (1.21.1 NeoForge version)
    implementation "curse.maven:ftb-teams-forge-404468:7170718"

    // Transitive runtime dependencies required by SDMShop + FTB Teams.
    // Without these the dedicated server aborts in pre-load (ftbteams needs ftblibrary
    // + architectury; sdmshop needs architectury). Versions chosen to satisfy
    // architectury>=13.0.8 and ftblibrary>=2101.1.25 for NeoForge 1.21.1.
    implementation "curse.maven:architectury-api-419699:5786327"   // Architectury API 13.0.8
    implementation "curse.maven:ftb-library-404465:7746959"        // FTB Library 2101.1.31
}

// This block of code expands all declared replace properties in the specified resource targets.
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
