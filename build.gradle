plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = mod_version
group = mod_group_id

base {
    // Release artifact name (filename only). The in-jar MOD_ID stays "minecolonytax"
    // (gradle.properties mod_id) so existing worlds/saves are unaffected by the rebrand.
    archivesName = "WarNTaxes"
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
            jvmArgs '-Xmx5G'
        }
        client2 {
            parent runs.client //  Inherits from client (removes need for mainClass)
            workingDirectory project.file("run2") //  Separate directory to prevent conflicts
            args "--username=Player2"
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        url "https://cursemaven.com"
    }
    maven { url "https://jitpack.io" }
    maven { url "https://maven.blamejared.com" }
    maven { url = "https://maven.saps.dev/minecraft" }
}

jarJar.enable()

dependencies {

    // MySQL/MariaDB connector — bundled into the mod JAR via JarJar.
    // Server admins get the DB credentials from the Pterodactyl panel → Databases tab.
    jarJar(implementation('com.mysql:mysql-connector-j:8.3.0')) {
        jarJar.ranged(it, '[8.0.0,9.0.0)')
    }

    implementation fg.deobf("curse.maven:minecolonies-245506:8615315")
    runtimeOnly fg.deobf("curse.maven:blockui-522992:7606230")
    runtimeOnly fg.deobf("curse.maven:multi-piston-303278:7097889")
    runtimeOnly fg.deobf("curse.maven:domum-ornamentum-527361:8179147")
    runtimeOnly fg.deobf("curse.maven:structurize-298744:8610456")
    runtimeOnly fg.deobf("curse.maven:jei-238222:7920915")
    // Corpse (henkelmax) - dev runtime only, so runServer/runClient can exercise the corpse
    // retrieval integration. Same scope as the other optional integrations above; not shipped.
    runtimeOnly fg.deobf("curse.maven:corpse-316582:7018272")
    implementation fg.deobf("curse.maven:sdm-shop-948942:7935087")
    runtimeOnly fg.deobf("curse.maven:ftb-library-forge-404465:7296748")
    runtimeOnly fg.deobf("curse.maven:sdm-economy-1102542:6689080")
    runtimeOnly fg.deobf("curse.maven:sdm-engine-core-964997:7090174")
    runtimeOnly fg.deobf("curse.maven:sdm-ui-lib-1095061:6086204")
    runtimeOnly fg.deobf("curse.maven:architectury-api-419699:5137938")
    implementation fg.deobf("curse.maven:ftb-teams-forge-404468:7499810")
    implementation fg.deobf("curse.maven:recruits-523860:7906232")
    implementation fg.deobf("vazkii.patchouli:Patchouli:1.20.1-84-FORGE")
    // easy-factions removed: ServerConfig.onLoad bug crashes dev env (no code depends on it)
    // runtimeOnly fg.deobf("curse.maven:easy-factions-1419148:7678446")
    implementation fg.deobf("curse.maven:journeymap-32274:5789363")

    // Explosion't (Harmonised) — optional runtime dep. When loaded, our mixin
    // (mixin/WorldTickHandlerMixin) pauses its tick during active wars so it
    // becomes war-aware: snapshots accumulate during the fight, restoration
    // resumes when the war ends. compileOnly so we can reference its classes
    // in the mixin; runtimeOnly so the dev env loads it for testing.
    // File: explosiont-1.20.1-2.4.8.jar (project 388909, file 4848559)
    compileOnly fg.deobf("curse.maven:explosiont-388909:4848559")
    runtimeOnly fg.deobf("curse.maven:explosiont-388909:4848559")


    minecraft "net.minecraftforge:forge:1.20.1-47.3.10"

    // Unit tests (plain JUnit, no Minecraft bootstrap needed)
    // Corpse (henkelmax), TEST SCOPE ONLY - project 316582, file 7018272 = 1.20.1-1.0.23.
    // Deliberately NOT a compile dependency: the production integration touches no Corpse type at
    // all (entity matched by registry id, owner read reflectively). It is on the test classpath so
    // CorpseContractTest can assert against the REAL jar that the reflection target still exists -
    // a Corpse update that renames it then fails the build instead of silently disabling the
    // feature on players' servers.
    testRuntimeOnly fg.deobf("curse.maven:corpse-316582:7018272")

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

// ---------------------------------------------------------------------------
// MineColonies API compatibility guard.
//
// MineColonies renamed IColony#getBuildingManager() to getServerBuildingManager(),
// which crashed users running a different MineColonies version than the one we
// compile against (NoSuchMethodError during server tick). ALL building access must
// go through the reflection shim ColonyBuildingUtil.getBuildings(colony), which
// supports both API shapes at runtime.
//
// This task fails the build if any source file outside the shim calls either
// method directly (or references the version-specific manager interface).
// Runs automatically as part of `gradlew build` / `gradlew check`.
// ---------------------------------------------------------------------------
def buildingApiGuard = tasks.register('checkBuildingApiUsage') {
    group = 'verification'
    description = 'Fails the build on direct MineColonies building-manager API usage outside ColonyBuildingUtil'
    def srcDir = file('src/main/java')
    def reportFile = layout.buildDirectory.file('reports/buildingApiGuard.txt')
    inputs.dir(srcDir)
    outputs.file(reportFile)
    doLast {
        def offenders = []
        def pattern = ~/\.\s*(getServerBuildingManager|getBuildingManager)\s*\(|\bIRegisteredStructureManager\b/
        srcDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!f.name.endsWith('.java') || f.name == 'ColonyBuildingUtil.java') return
            boolean inBlockComment = false
            f.readLines('UTF-8').eachWithIndex { line, idx ->
                def code = line
                if (inBlockComment) {
                    def end = code.indexOf('*/')
                    if (end < 0) return
                    code = code.substring(end + 2)
                    inBlockComment = false
                }
                code = code.replaceAll('//.*$', '')
                while (true) {
                    def start = code.indexOf('/*')
                    if (start < 0) break
                    def end = code.indexOf('*/', start + 2)
                    if (end < 0) { code = code.substring(0, start); inBlockComment = true; break }
                    code = code.substring(0, start) + code.substring(end + 2)
                }
                if (code =~ pattern) {
                    offenders << "${f.absolutePath}:${idx + 1}: ${line.trim()}"
                }
            }
        }
        def report = reportFile.get().asFile
        report.parentFile.mkdirs()
        report.text = offenders.isEmpty() ? 'OK - no direct building-manager API usage.\n' : offenders.join('\n') + '\n'
        if (!offenders.isEmpty()) {
            throw new GradleException(
                "Direct MineColonies building-manager API usage detected.\n" +
                "Use ColonyBuildingUtil.getBuildings(colony) instead - direct calls crash with NoSuchMethodError " +
                "on MineColonies versions that have the other API shape:\n  " + offenders.join('\n  '))
        }
    }
}
tasks.named('check') { dependsOn buildingApiGuard }

// ---------------------------------------------------------------------------
// Colony permission / lookup guard.
//
// Two bug classes shipped to players and are easy to reintroduce, so they are
// gated here rather than left to review:
//
//  1. Numeric rank comparisons. MineColonies numbers ranks OWNER=0 .. HOSTILE=4,
//     i.e. the number grows as privilege FALLS, and colony-defined custom ranks
//     start at 5. Code written as `rank.getId() >= n` reads backwards: it hid the
//     owner and every officer from the Officers tab, and separately let ordinary
//     colony friends answer peace proposals while locking officers out. Use the
//     named accessors (getRankOwner/getRankOfficer/isColonyManager/isHostile).
//     Reading getId() is still fine - only comparing it is banned.
//
//  2. Ad-hoc colony-id lookups in client-triggered packets. getColonyByWorld(id,
//     level) only sees the level the player currently stands in, so several
//     screens came up empty for anyone outside the overworld; and a bare
//     getAllColonies() filter on getID() is not a safe substitute, because
//     MineColonies keeps one colony list per dimension with its own id counter,
//     so ids are unique per dimension only. Packets must use ColonyLookup.
//
// Runs automatically as part of `gradlew build` / `gradlew check`.
// ---------------------------------------------------------------------------
def colonyPermissionGuard = tasks.register('checkColonyPermissionUsage') {
    group = 'verification'
    description = 'Fails the build on numeric rank comparisons or ad-hoc colony-id lookups in packets'
    def srcDir = file('src/main/java')
    def reportFile = layout.buildDirectory.file('reports/colonyPermissionGuard.txt')
    inputs.dir(srcDir)
    outputs.file(reportFile)
    doLast {
        // `rank.getId() >= 2` and friends. Assigning getId() to a variable (as the spy
        // intel roster does when sorting) is deliberately NOT matched.
        def rankPattern = ~/(?i)\brank\w*\s*\.\s*getId\s*\(\s*\)\s*(<=|>=|<|>|==|!=)|getRank\s*\(\s*\)\s*\.\s*getId\s*\(\s*\)\s*(<=|>=|<|>|==|!=)/
        def lookupPattern = ~/\.\s*getColonyByWorld\s*\(|getAllColonies\s*\(\s*\)\s*\.\s*stream\s*\(\s*\)/
        // `colony.getPermissions().getOwner().equals(uuid)` NPEs on a colony whose owner record
        // is damaged - and those exist in the wild, which is why this mod ships owner-repair
        // tooling. Inside a filter over every colony, one bad colony breaks the operation for
        // everyone. Compare the other way round: `uuid.equals(...getOwner())`.
        def ownerPattern = ~/\.\s*getOwner\s*\(\s*\)\s*\.\s*equals\s*\(/
        // Resolving a colony id against a hard-coded overworld. MineColonies defaults
        // allowotherdimcolonies=true and TaxManager already generates tax across every level,
        // so an overworld-pinned lookup makes colonies elsewhere invisible - and returns the
        // WRONG colony when an overworld colony happens to share the id. Matched across
        // newlines ([^;] spans them) because the call is routinely wrapped onto two lines.
        def overworldPattern = ~/getColonyByWorld\s*\([^;]*overworld\s*\(\s*\)/
        // getAllColonies().stream().filter(c -> c.getID() == id) looks global but is not: ids are
        // unique PER DIMENSION, so this silently picks whichever level iterates first. Matches only
        // id-FILTERING - plain iteration over all colonies stays legal.
        def idFilterPattern = ~/getAllColonies\s*\(\s*\)[^;]*?filter[^;]*?getID\s*\(\s*\)\s*==/
        // Optional mods must only ever be touched from their dedicated impl class. A direct import
        // anywhere else makes the JVM resolve that type when the OUTER class loads, which throws
        // NoClassDefFoundError on a server without the mod - before any isLoaded() guard can run.
        def optionalModPackages = ['dev.ftb.': 'FtbTeamsCompatImpl.java', 'journeymap.': 'JmImpl.java']

        def rankOffenders = []
        def lookupOffenders = []
        def ownerOffenders = []
        def overworldOffenders = []
        def idFilterOffenders = []
        def optionalImportOffenders = []

        srcDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!f.name.endsWith('.java')) return
            if (f.name == 'ColonyLookup.java') return
            def path = f.absolutePath.replace('\\', '/')
            boolean isPacket = path.contains('/network/packets/')

            boolean inBlockComment = false
            def strippedFile = new StringBuilder()
            f.readLines('UTF-8').eachWithIndex { line, idx ->
                def code = line
                if (inBlockComment) {
                    def end = code.indexOf('*/')
                    if (end < 0) return
                    code = code.substring(end + 2)
                    inBlockComment = false
                }
                code = code.replaceAll('//.*$', '')
                while (true) {
                    def start = code.indexOf('/*')
                    if (start < 0) break
                    def end = code.indexOf('*/', start + 2)
                    if (end < 0) { code = code.substring(0, start); inBlockComment = true; break }
                    code = code.substring(0, start) + code.substring(end + 2)
                }
                if (code =~ rankPattern) {
                    rankOffenders << "${f.absolutePath}:${idx + 1}: ${line.trim()}"
                }
                if (isPacket && code =~ lookupPattern) {
                    lookupOffenders << "${f.absolutePath}:${idx + 1}: ${line.trim()}"
                }
                if (code =~ ownerPattern) {
                    ownerOffenders << "${f.absolutePath}:${idx + 1}: ${line.trim()}"
                }
                optionalModPackages.each { pkg, allowedFile ->
                    if (code =~ ('^\s*import\s+' + java.util.regex.Pattern.quote(pkg)) && f.name != allowedFile) {
                        optionalImportOffenders << "${f.absolutePath}:${idx + 1}: ${line.trim()} (only ${allowedFile} may import ${pkg}*)"
                    }
                }
                strippedFile.append(code).append('\n')
            }

            // Multi-line scan over the comment-stripped file: report the 1-based line the
            // match starts on by counting newlines ahead of it.
            def text = strippedFile.toString()
            def m = overworldPattern.matcher(text)
            while (m.find()) {
                def lineNo = text.substring(0, m.start()).count('\n') + 1
                overworldOffenders << "${f.absolutePath}:${lineNo}: ${m.group().replaceAll('\\s+', ' ').trim()}"
            }
            def m2 = idFilterPattern.matcher(text)
            while (m2.find()) {
                def lineNo = text.substring(0, m2.start()).count('\n') + 1
                idFilterOffenders << "${f.absolutePath}:${lineNo}: ${m2.group().replaceAll('\\s+', ' ').trim()}"
            }
        }

        def report = reportFile.get().asFile
        report.parentFile.mkdirs()
        def all = rankOffenders + lookupOffenders + ownerOffenders + overworldOffenders + idFilterOffenders + optionalImportOffenders
        report.text = all.isEmpty() ? 'OK - rank comparisons, colony lookups, owner comparisons and dimension handling are all safe.\n'
                                    : all.join('\n') + '\n'

        def problems = []
        if (!rankOffenders.isEmpty()) {
            problems << "Numeric MineColonies rank comparison detected.\n" +
                "Rank ids run OWNER=0 .. HOSTILE=4 (higher number = less privilege) and custom ranks start at 5, " +
                "so comparing them numerically inverts the intended check. Use getRankOwner()/getRankOfficer()/" +
                "isColonyManager()/isHostile() instead:\n  " + rankOffenders.join('\n  ')
        }
        if (!lookupOffenders.isEmpty()) {
            problems << "Ad-hoc colony-id lookup in a client-triggered packet.\n" +
                "getColonyByWorld(id, level) misses colonies outside the player's current dimension, and a bare " +
                "getAllColonies() filter can hit a same-id colony from another dimension. " +
                "Use ColonyLookup.byId(colonyId, player):\n  " + lookupOffenders.join('\n  ')
        }
        if (!ownerOffenders.isEmpty()) {
            problems << "Null-unsafe colony owner comparison detected.\n" +
                "getOwner() returns null on a colony with a damaged owner record, so " +
                "colony.getPermissions().getOwner().equals(uuid) throws - and inside a filter over all " +
                "colonies that breaks the operation for every player. Write uuid.equals(...getOwner()):\n  " +
                ownerOffenders.join('\n  ')
        }
        if (!overworldOffenders.isEmpty()) {
            problems << "Dimension-blind colony lookup detected.\n" +
                "getColonyByWorld(id, ...overworld()) reads only the overworld's colony-manager " +
                "capability. MineColonies defaults allowotherdimcolonies=true and TaxManager taxes " +
                "every dimension, so a colony outside the overworld becomes invisible here - and " +
                "because ids are unique per dimension only, a same-id overworld colony is returned " +
                "in its place (wrong treasury, wrong spy target). Use ColonyLookup.byId(colonyId), " +
                "and derive any ServerLevel from the resolved colony's own dimension:\n  " +
                overworldOffenders.join('\n  ')
        }
        if (!idFilterOffenders.isEmpty()) {
            problems << "Ambiguous colony-id filter detected.\n" +
                "getAllColonies().filter(c -> c.getID() == id) looks global but MineColonies keeps one " +
                "colony list per level, each with its own id counter - ids are unique PER DIMENSION only, " +
                "so this silently resolves to whichever level iterates first. Use ColonyLookup.byId(id), " +
                "which disambiguates deterministically and logs when an id really is ambiguous:\n  " +
                idFilterOffenders.join('\n  ')
        }
        if (!optionalImportOffenders.isEmpty()) {
            problems << "Optional-mod type imported outside its compat impl.\n" +
                "Importing an optional mod's classes makes the JVM resolve them when the importing " +
                "class loads - so on a server WITHOUT that mod you get NoClassDefFoundError before " +
                "any ModList.isLoaded() guard can run. Route the call through the compat shim and " +
                "keep the import inside its impl class:\n  " +
                optionalImportOffenders.join('\n  ')
        }
        if (!problems.isEmpty()) {
            throw new GradleException(problems.join('\n\n'))
        }
    }
}
tasks.named('check') { dependsOn colonyPermissionGuard }

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                // Register our mixin config so Forge applies the Explosion't war-aware
                // mixin at runtime. The mixin is targets-by-string and required=false,
                // so it silently no-ops when Explosion't isn't installed.
                'MixinConfigs'            : 'warntax.mixins.json'
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
