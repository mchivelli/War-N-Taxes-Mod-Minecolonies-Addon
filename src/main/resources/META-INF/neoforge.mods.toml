# NeoForge mods.toml file for Minecraft 1.21.1
# This file contains the metadata for loading mods.
# The overall format is standard TOML format, v0.5.0.
# Find more information on toml format here: https://github.com/toml-lang/toml

# The name of the mod loader type to load - for NeoForge @Mod mods it should be javafml
modLoader="javafml"

# A version range to match for said mod loader
loaderVersion="${loader_version_range}"

# The license for your mod
license="MIT"

# Mod list (the [[mods]] table header is REQUIRED — without it FML reports
# "Missing mods list" and refuses to load the file as a valid mod).
[[mods]]
# The mod ID - must match the @Mod annotation
modId="${mod_id}"

# The version of the mod
version="${mod_version}"

# A display name for the mod
displayName="${mod_name}"

# The description text for the mod
description='''${mod_description}'''

# The authors of the mod
authors="${mod_authors}"

# Logo file (in the root of the mod JAR)
#logoFile="logo.png"

# A URL to refer people to when problems occur with this mod
#issueTrackerURL="https://github.com/yourrepo/issues"

# A URL for the "homepage" for this mod
#displayURL="https://yourwebsite.com"

# Dependencies
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Required dependencies for MineColony Tax Addon
[[dependencies.${mod_id}]]
    modId="minecolonies"
    type="required"
    # Floor is the oldest MineColonies whose API surface has actually been VERIFIED against this
    # build (see CompatibilityCheck + CompatibilityCheckTest), not the oldest that might work.
    # It used to read [1.1.759,) - a claim nothing tested. MineColonies removes API between
    # builds and the mismatches are missing methods / missing enum constants, so NeoForge loads
    # the mod happily and the server dies mid-session: exactly how 5.0.4 shipped broken.
    # Verified: 1.1.1164 and 1.1.1368. Upper bound stays open because a future MineColonies
    # cannot be tested in advance; CompatibilityCheck reports drift inside the range at startup.
    versionRange="[1.1.1164,)"
    ordering="AFTER"
    side="BOTH"

# Corpse (henkelmax) - OPTIONAL. Only used to let a player retrieve their OWN corpse inside a
# colony they have no interaction rights in; no Corpse type is referenced anywhere in the code
# (the entity is matched by its registry id), so the mod is genuinely optional at runtime.
[[dependencies.${mod_id}]]
    modId="corpse"
    type="optional"
    versionRange="[1.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sdmshop"
    type="optional"
    versionRange="[2.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ftbteams"
    type="optional"
    versionRange="[2101.1.0,)"
    ordering="AFTER"
    side="BOTH"

